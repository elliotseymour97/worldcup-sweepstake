<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}LM Sweepstake 2026{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#34d399">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LM Sweep 2026">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <style>
    .tier-badge-1 { background:#f59e0b; color:#1c1917; }
    .tier-badge-2 { background:#94a3b8; color:#1c1917; }
    .tier-badge-3 { background:#b45309; color:#fff; }
    .tier-badge-4 { background:#4b5563; color:#fff; }
    #page-loader { position:fixed;top:0;left:0;width:100%;height:3px;background:#34d399;opacity:0;transition:opacity 200ms;z-index:100;pointer-events:none; }
    @keyframes live-glow { 0%,100%{border-color:rgb(52 211 153/.4)} 50%{border-color:rgb(52 211 153/.9)} }
    .card-live { animation: live-glow 1.5s ease-in-out infinite; }
    @keyframes toast-in  { from{transform:translateX(calc(100% + 1rem));opacity:0} to{transform:translateX(0);opacity:1} }
    @keyframes toast-out { from{opacity:1;transform:translateX(0)} to{opacity:0;transform:translateX(calc(100% + 1rem))} }
    .toast-enter { animation: toast-in  .35s cubic-bezier(.22,1,.36,1) forwards; }
    .toast-exit  { animation: toast-out .3s ease forwards; }
    /* Hide scrollbar on nav strip */
    .nav-strip { scrollbar-width:none; -ms-overflow-style:none; }
    .nav-strip::-webkit-scrollbar { display:none; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

  <div id="page-loader"></div>
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none max-w-xs w-full sm:w-auto"></div>

  <nav class="bg-gray-900 border-b border-gray-800 sticky top-0 z-10">
    <div class="nav-strip max-w-6xl mx-auto px-4 py-3 flex items-center gap-5 overflow-x-auto">
      <span class="font-bold text-emerald-400 text-sm tracking-tight flex-shrink-0 mr-1">⚽ LM Sweep</span>
      <a href="/"        class="text-sm hover:text-emerald-400 transition-colors flex-shrink-0 whitespace-nowrap {% if request.path == '/' %}text-emerald-400{% else %}text-gray-400{% endif %}">League</a>
      <a href="/scores"  class="text-sm hover:text-emerald-400 transition-colors flex-shrink-0 whitespace-nowrap {% if request.path.startswith('/scores') %}text-emerald-400{% else %}text-gray-400{% endif %}">Scores</a>
      <a href="/groups"  class="text-sm hover:text-emerald-400 transition-colors flex-shrink-0 whitespace-nowrap {% if request.path == '/groups' %}text-emerald-400{% else %}text-gray-400{% endif %}">Groups</a>
      <a href="/bracket" class="text-sm hover:text-emerald-400 transition-colors flex-shrink-0 whitespace-nowrap {% if request.path == '/bracket' %}text-emerald-400{% else %}text-gray-400{% endif %}">Bracket</a>
      <a href="/teams"   class="text-sm hover:text-emerald-400 transition-colors flex-shrink-0 whitespace-nowrap {% if request.path == '/teams' %}text-emerald-400{% else %}text-gray-400{% endif %}">Teams</a>
      <a href="/rules"   class="text-sm hover:text-emerald-400 transition-colors flex-shrink-0 whitespace-nowrap {% if request.path == '/rules' %}text-emerald-400{% else %}text-gray-400{% endif %}">Rules</a>
      <a href="/admin"   class="text-sm hover:text-emerald-400 transition-colors flex-shrink-0 whitespace-nowrap ml-auto {% if request.path.startswith('/admin') %}text-emerald-400{% else %}text-gray-400{% endif %}">Admin</a>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-8">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash-msg mb-4 px-4 py-3 rounded-lg text-sm font-medium transition-opacity duration-500
          {{ 'bg-emerald-900 border border-emerald-700 text-emerald-200' if category == 'success' else 'bg-red-900 border border-red-700 text-red-200' }}">
          {{ message }}
        </div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <script>
    // Loading bar
    const loader = document.getElementById('page-loader');
    document.addEventListener('htmx:beforeRequest', () => loader.style.opacity = '1');
    document.addEventListener('htmx:afterSettle',   () => loader.style.opacity = '0');

    // Auto-dismiss flash messages after 4s
    setTimeout(() => {
      document.querySelectorAll('.flash-msg').forEach(el => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 500);
      });
    }, 4000);

    // In-app goal toast
    function showToast(msg, duration) {
      duration = duration || 5000;
      const c = document.getElementById('toast-container');
      if (!c) return;
      const el = document.createElement('div');
      el.className = 'toast-enter bg-emerald-900 border border-emerald-600 text-emerald-100 text-sm font-semibold px-4 py-3 rounded-xl shadow-xl pointer-events-auto cursor-pointer';
      el.textContent = msg;
      el.onclick = function() { el.classList.replace('toast-enter', 'toast-exit'); setTimeout(function(){ el.remove(); }, 350); };
      c.appendChild(el);
      setTimeout(function() {
        if (el.parentNode) {
          el.classList.replace('toast-enter', 'toast-exit');
          setTimeout(function(){ el.remove(); }, 350);
        }
      }, duration);
    }

    // Convert UTC kickoff times to local timezone
    function localizeTimestamps() {
      document.querySelectorAll('time[data-utc]').forEach(el => {
        const d = new Date(el.dataset.utc);
        el.textContent = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })
                       + ' '
                       + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      });
    }
    document.addEventListener('DOMContentLoaded', localizeTimestamps);
    document.addEventListener('htmx:afterSettle',  localizeTimestamps);
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
