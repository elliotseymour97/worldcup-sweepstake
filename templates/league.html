{% extends 'base.html' %}
{% block title %}League Table – WC 2026 Sweep{% endblock %}
{% block content %}

<div class="flex justify-between items-center mb-1">
  <h1 class="text-3xl font-bold">League Table</h1>
  <span class="text-gray-600 text-xs">Auto-refreshes every 60s</span>
</div>
<p class="text-gray-500 text-sm mb-8">Points → Goal difference → Furthest stage reached</p>

<div id="standings-data"
     hx-get="/league/standings"
     hx-trigger="every 60s"
     hx-swap="innerHTML">
  {% include '_standings_partial.html' %}
</div>

{% endblock %}
