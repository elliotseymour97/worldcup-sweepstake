{% extends 'base.html' %}
{% block title %}Admin Login – WC 2026 Sweep{% endblock %}
{% block content %}

<div class="max-w-sm mx-auto mt-16">
  <h1 class="text-2xl font-bold mb-6 text-center">Admin Login</h1>

  {% if error %}
  <div class="mb-4 px-4 py-3 rounded-lg text-sm font-medium bg-red-900 border border-red-700 text-red-200">
    {{ error }}
  </div>
  {% endif %}

  <form method="post" class="bg-gray-900 rounded-xl border border-gray-800 p-6 space-y-4">
    <div>
      <label class="block text-sm text-gray-400 mb-1" for="password">Password</label>
      <input id="password" name="password" type="password" autofocus
             class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 focus:outline-none focus:border-emerald-500" />
    </div>
    <button type="submit"
            class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-lg px-4 py-2 text-sm transition-colors">
      Log in
    </button>
  </form>
</div>

{% endblock %}
